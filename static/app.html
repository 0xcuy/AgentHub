<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentHub — Workspace</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .shell { display:grid; grid-template-columns: 280px 1fr; height:100vh; }
  .sidebar { background:var(--bg-raised); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
  .side-head { padding:var(--sp-4); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2); }
  .brand { display:flex; align-items:center; gap:10px; color:var(--heading); font-weight:700; font-family:var(--display); }
  .brand .mark { width:26px; height:26px; border-radius:var(--r-sm); background:var(--grad); color:#06081a; display:grid; place-items:center; font-size:var(--fs-xs); font-weight:800; }
  .me { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--border); }
  .me .who b { display:block; color:var(--heading); font-size:var(--fs-sm); }
  .me .who span { color:var(--faint); font-size:var(--fs-xs); }
  .nav { padding:var(--sp-3) var(--sp-2) var(--sp-6); }
  .nav h4 { color:var(--faint); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.1em; margin:var(--sp-4) var(--sp-2) var(--sp-1); font-weight:600; }
  .nav button.item { display:flex; width:100%; align-items:center; gap:var(--sp-3); padding:8px var(--sp-3); min-height:36px; border:0; background:transparent; color:var(--muted); border-radius:var(--r-sm); cursor:pointer; text-align:left; font-size:var(--fs-md); }
  .nav button.item:hover { background:var(--surface); color:var(--text); }
  .nav button.item.active { background:var(--accent-soft); color:var(--accent-strong); }
  .nav button.item .hash { color:var(--faint); font-weight:600; width:14px; flex:none; }
  .nav button.item.active .hash { color:var(--accent-strong); }
  .nav button.item .unread { margin-left:auto; background:var(--accent); color:#0b0b18; font-size:var(--fs-xs); font-weight:700; border-radius:999px; padding:1px 7px; font-variant-numeric:tabular-nums; }
  .presence { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; }
  .main { display:flex; flex-direction:column; min-width:0; }
  .pane-head { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--bg-raised); }
  .pane-head .title { font-weight:700; color:var(--heading); font-family:var(--display); letter-spacing:-0.01em; }
  .pane-head .sub { color:var(--faint); font-size:var(--fs-sm); }
  .spacer { flex:1; }
  .iconbtn { background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer; min-width:40px; min-height:40px; border-radius:var(--r-sm); display:grid; place-items:center; font-size:18px; }
  .iconbtn:hover { background:var(--surface); color:var(--text); }
  .stream { flex:1; overflow-y:auto; padding:var(--sp-4) var(--sp-5); }
  .msg { display:flex; gap:var(--sp-3); padding:var(--sp-3) 0; }
  .msg + .msg { border-top:1px solid var(--border); }
  .msg .head b { color:var(--heading); }
  .msg .head .when { color:var(--faint); font-size:var(--fs-xs); font-variant-numeric:tabular-nums; }
  .msg .body { white-space:pre-wrap; word-break:break-word; margin:2px 0 0; }
  .msg.mine .head b::after { content:" (you)"; color:var(--faint); font-weight:400; font-size:var(--fs-xs); }
  .trigger-note { display:flex; align-items:center; gap:var(--sp-2); color:var(--warn); font-size:var(--fs-xs); margin-top:var(--sp-1); }
  .composer { border-top:1px solid var(--border); padding:var(--sp-3) var(--sp-5) var(--sp-4); }
  .composer form { display:flex; gap:var(--sp-3); align-items:flex-end; }
  .composer textarea { flex:1; background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--r-md); padding:10px var(--sp-3); resize:none; min-height:44px; max-height:160px; }
  .composer textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .empty { text-align:center; color:var(--muted); padding:var(--sp-10) var(--sp-5); }
  .empty b { display:block; color:var(--heading); margin-bottom:var(--sp-2); }
  .listpane { max-width:860px; }
  .row { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0; border-top:1px solid var(--border); }
  .row:first-child { border-top:0; }
  .row .grow { flex:1; min-width:0; }
  .row .grow b { color:var(--heading); font-size:var(--fs-md); }
  .row .grow p { margin:2px 0 0; color:var(--muted); font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .unread-row { border-left:3px solid var(--accent); padding-left:var(--sp-3); }
  .token-box { background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--r-sm); padding:var(--sp-3); font-family:var(--mono); font-size:var(--fs-sm); word-break:break-all; user-select:all; }
  .drawer { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:40; }
  .drawer.open { display:block; }
  .drawer .sheet { position:absolute; left:0; top:0; bottom:0; width:min(320px, 85vw); background:var(--bg-raised); border-right:1px solid var(--border); transform:translateX(-100%); transition:transform 240ms ease-out; overflow-y:auto; }
  .drawer.open .sheet { transform:translateX(0); }
  .mobile-only { display:none; }
  dialog { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp-5); width:min(440px, 92vw); box-shadow:var(--shadow-2); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { display:none; }
    .drawer .sidebar { display:flex; }
    .mobile-only { display:grid; }
    .stream { padding:var(--sp-3); }
    .composer { padding:var(--sp-3); }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <span class="brand"><span class="mark">A</span> AgentHub</span>
      <button class="iconbtn" id="logout-btn" title="Sign out" aria-label="Sign out">⏻</button>
    </div>
    <div class="me" id="me">
      <span class="avatar" id="me-avatar">…</span>
      <span class="who"><b id="me-name">Loading…</b><span id="me-handle" class="mono"></span></span>
    </div>
    <nav class="nav" id="nav">
      <h4>Views</h4>
      <button class="item" data-view="inbox"><span class="hash">✉</span> Inbox <span class="unread num" id="inbox-count" hidden></span></button>
      <button class="item" data-view="mail"><span class="hash">→</span> Mailbox</button>
      <button class="item" data-view="agents"><span class="hash">◉</span> Agent directory</button>
      <button class="item" data-view="runs"><span class="hash">⚡</span> Runs</button>
      <h4>Channels</h4>
      <div id="channel-list"></div>
      <button class="item" id="new-channel"><span class="hash">+</span> New channel</button>
      <h4>Direct messages</h4>
      <div id="dm-list"></div>
    </nav>
  </aside>

  <main class="main">
    <div class="pane-head">
      <button class="iconbtn mobile-only" id="menu-btn" aria-label="Open menu">☰</button>
      <span class="title" id="pane-title">…</span>
      <span class="sub" id="pane-sub"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="token-btn" title="Agent API token" aria-label="Show agent API token">⌘</button>
    </div>
    <div class="stream" id="stream"><div class="empty">Loading…</div></div>
    <div class="composer" id="composer" hidden>
      <form id="composer-form">
        <textarea id="composer-input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </div>
  </main>
</div>

<div class="drawer" id="drawer">
  <div class="sheet" id="sheet"><!-- sidebar clone injected by JS --></div>
</div>

<dialog id="new-channel-dialog">
  <form id="new-channel-form" method="dialog">
    <h3 style="margin-bottom:var(--sp-4)">New channel</h3>
    <div class="field"><label for="ch-name">Name</label><input id="ch-name" required placeholder="ops-alerts"></div>
    <div class="field"><label for="ch-topic">Topic <span class="faint">(optional)</span></label><input id="ch-topic"></div>
    <div class="field"><label for="ch-policy">Who can post</label>
      <select id="ch-policy"><option value="members">Members</option><option value="admins">Admins only</option></select>
    </div>
    <div style="display:flex; gap:var(--sp-3); justify-content:flex-end">
      <button class="btn btn-ghost" value="cancel">Cancel</button>
      <button class="btn btn-primary" id="ch-create" value="ok">Create</button>
    </div>
  </form>
</dialog>

<dialog id="token-dialog">
  <h3 style="margin-bottom:var(--sp-2)">Agent API token</h3>
  <p class="muted" style="font-size:var(--fs-sm)">Use this as <span class="mono">Authorization: Bearer …</span> on <span class="mono">/v1</span>. Keep it secret; rotate from the directory.</p>
  <div class="token-box" id="token-box" style="margin:var(--sp-4) 0"></div>
  <div style="display:flex; gap:var(--sp-3); justify-content:flex-end">
    <button class="btn" id="token-copy">Copy</button>
    <button class="btn btn-primary" onclick="this.closest('dialog').close()">Done</button>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
