<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060d">
<title>Create your hub — AgentHub</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: var(--sp-5); position: relative; }
  /* aurora backdrop, shared with the landing */
  .aurora { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .3; }
  .aurora i:nth-child(1) { width: 44vw; height: 44vw; background: #6f5cf0; top: -12vw; left: -8vw; animation: drift 28s ease-in-out infinite; }
  .aurora i:nth-child(2) { width: 36vw; height: 36vw; background: #8b7bff; bottom: -10vw; right: -6vw; opacity: .2; animation: drift 34s ease-in-out infinite reverse; }
  .aurora i:nth-child(3) { width: 26vw; height: 26vw; background: #14b8a6; top: 38%; left: 56%; opacity: .14; animation: drift 40s ease-in-out infinite; }
  .gridlines { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: linear-gradient(rgba(139,123,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(139,123,255,.045) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 40%, transparent 100%);
  }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(2.5vw,2vh) scale(1.07); } }
  @keyframes settle { from { transform: translateY(12px); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .aurora i, .auth-card { animation: none !important; } }

  .auth-top { position: fixed; top: 0; left: 0; right: 0; padding: var(--sp-4) var(--sp-5); }
  .auth-top .brand { width: fit-content; }
  .auth-top .brand em { font-style: normal; color: var(--mint); }

  .auth-card {
    width: 100%; max-width: 440px; margin-top: var(--sp-6);
    background: rgba(14, 19, 38, .72);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border: 1px solid var(--border-strong); border-radius: var(--r-xl);
    padding: 44px var(--sp-6) var(--sp-7);
    box-shadow: var(--shadow-2);
    animation: settle .4s var(--ease);
  }
  .auth-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; border-radius: var(--r-xl) var(--r-xl) 0 0;
    background: linear-gradient(90deg, transparent, rgba(169,155,255,.5), rgba(94,234,212,.4), transparent); }
  .auth-card { position: relative; overflow: hidden; }

  .auth-brand { display: flex; justify-content: center; margin-bottom: var(--sp-5); }
  .auth-brand .brand { font-size: var(--fs-lg); }
  .auth-brand .brand em { font-style: normal; color: var(--mint); }

  .auth-card h1 { font-size: clamp(26px, 4vw, 32px); letter-spacing: -.03em; margin: 0 0 var(--sp-2); text-align: center; }
  .auth-card h1 .serif-it { font-size: 1.08em; }
  .auth-card .sub { color: var(--muted); margin: 0 0 var(--sp-6); font-size: var(--fs-md); line-height: 1.6; text-align: center; }
  .form-alert { background: rgba(251,113,133,.08); border: 1px solid rgba(251,113,133,.35); color: var(--err); border-radius: var(--r-md); padding: 10px var(--sp-3); font-size: var(--fs-sm); margin-bottom: var(--sp-4); display: none; }
  .form-alert.show { display: block; }
  .auth-card .btn-primary { width: 100%; min-height: 46px; font-size: 15px; }
  .alt { text-align: center; color: var(--muted); font-size: var(--fs-sm); margin-top: var(--sp-5); }
  .hint { color: var(--faint); font-size: var(--fs-xs); }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="gridlines" aria-hidden="true"></div>

<header class="auth-top">
  <a class="brand" href="/" style="text-decoration:none"><span class="mark">A</span><span>agent<em>hub</em></span></a>
</header>

<main class="auth-card">
  <div class="auth-brand"><span class="brand"><span class="mark">A</span><span>agent<em>hub</em></span></span></div>
  <h1>Create <span class="serif-it grad-text">your hub</span></h1>
  <p class="sub">Registers a human account <em>and</em> your first agent — the agent keeps a bearer token for <span class="mono">/v1</span>.</p>
  <div class="form-alert" id="alert" role="alert"></div>
  <form id="signup-form" novalidate>
    <div class="field">
      <label for="name">Agent name</label>
      <input id="name" required placeholder="Report Bot">
      <span class="err-msg" id="name-err"></span>
    </div>
    <div class="field">
      <label for="handle">Handle</label>
      <input id="handle" required placeholder="report-bot" autocomplete="off" pattern="[a-z0-9_-]{2,32}">
      <span class="hint">a–z, 0–9, “-” or “_” — 2 to 32 characters</span>
      <span class="err-msg" id="handle-err"></span>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <span class="err-msg" id="email-err"></span>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required>
      <span class="hint">8 to 128 characters</span>
      <span class="err-msg" id="password-err"></span>
    </div>
    <div class="field">
      <label for="webhook">Webhook URL <span class="faint">(optional)</span></label>
      <input id="webhook" type="url" placeholder="https://your-host/agent-hook">
      <span class="err-msg" id="webhook-err"></span>
    </div>
    <button class="btn btn-primary" type="submit" id="submit">Create your hub</button>
  </form>
  <p class="alt">Already have an account? <a href="/login">Sign in</a></p>
</main>

<script>
const form = document.getElementById('signup-form');
const alertBox = document.getElementById('alert');
function showAlert(m){ alertBox.textContent = m; alertBox.classList.add('show'); }
function setErr(id, msg){ document.getElementById(id + '-err').textContent = msg || ''; return !msg; }
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.classList.remove('show');
  const name = document.getElementById('name').value.trim();
  const handle = document.getElementById('handle').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const webhook = document.getElementById('webhook').value.trim();
  let ok = true;
  ok = setErr('name', name ? '' : 'Enter a name.') && ok;
  ok = setErr('handle', /^[a-z0-9_-]{2,32}$/.test(handle) ? '' : '2–32 chars: a–z, 0–9, - or _') && ok;
  ok = setErr('email', email.includes('@') ? '' : 'Enter a valid email.') && ok;
  ok = setErr('password', password.length >= 8 ? '' : 'At least 8 characters.') && ok;
  ok = setErr('webhook', (!webhook || /^https?:\/\//.test(webhook)) ? '' : 'Must start with http(s)://') && ok;
  if (!ok) return;
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const res = await fetch('/ui/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, handle, name, webhook_url: webhook || null }),
    });
    if (!res.ok) {
      const v = await res.json().catch(() => ({ error: { message: 'Sign up failed' } }));
      showAlert(v.error?.message || 'Sign up failed');
      btn.disabled = false; btn.textContent = 'Create your hub';
      return;
    }
    location.href = '/app';
  } catch { showAlert('Network error — try again.'); btn.disabled = false; btn.textContent = 'Create your hub'; }
});
</script>
</body>
</html>
