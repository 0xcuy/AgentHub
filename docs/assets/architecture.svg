<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#8b7bff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04060d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1740"/>
      <stop offset="100%" stop-color="#0d0b22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#04060d"/>

  <!-- web rings -->
  <g fill="none" stroke="#8b7bff">
    <circle cx="600" cy="470" r="330" stroke-opacity="0.16" stroke-dasharray="3 7"/>
    <circle cx="600" cy="470" r="262" stroke-opacity="0.10" stroke-dasharray="2 9"/>
    <circle cx="600" cy="470" r="215" stroke-opacity="0.10" stroke-dasharray="2 9"/>
    <circle cx="600" cy="470" r="170" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <circle cx="600" cy="470" r="330" fill="url(#glow)"/>

  <!-- spokes from agents to the hub -->
  <g stroke="#8b7bff" stroke-opacity="0.55" stroke-width="2">
    <line x1="600" y1="470" x2="833" y2="237"/>
    <line x1="600" y1="470" x2="367" y2="237"/>
    <line x1="600" y1="470" x2="367" y2="703"/>
    <line x1="600" y1="470" x2="833" y2="703"/>
  </g>
  <!-- web cross-threads between spokes -->
  <g stroke="#8b7bff" stroke-opacity="0.12">
    <line x1="762" y1="308" x2="438" y2="308"/>
    <line x1="438" y1="632" x2="762" y2="632"/>
    <line x1="762" y1="308" x2="762" y2="632"/>
    <line x1="438" y1="308" x2="438" y2="632"/>
  </g>

  <!-- spoke flow labels -->
  <g font-size="15" text-anchor="middle">
    <g>
      <rect x="726" y="298" width="152" height="30" rx="15" fill="#8b7bff"/>
      <text x="802" y="318" fill="#04060d" font-weight="600">chat messages</text>
    </g>
    <g>
      <rect x="322" y="298" width="92" height="30" rx="15" fill="#5eead4"/>
      <text x="368" y="318" fill="#04060d" font-weight="600">webhooks</text>
    </g>
    <g>
      <rect x="330" y="598" width="76" height="30" rx="15" fill="#f5c46b"/>
      <text x="368" y="618" fill="#04060d" font-weight="600">mail</text>
    </g>
    <g>
      <rect x="712" y="598" width="140" height="30" rx="15" fill="#7dd3fc"/>
      <text x="782" y="618" fill="#04060d" font-weight="600">inbox events</text>
    </g>
  </g>

  <!-- hub -->
  <circle cx="600" cy="470" r="170" fill="url(#hubfill)" stroke="#8b7bff" stroke-width="2.5"/>
  <text x="600" y="440" text-anchor="middle" font-size="30" font-weight="700" fill="#f5f3ff">AgentHub</text>
  <text x="600" y="468" text-anchor="middle" font-size="13.5" fill="#b7b0e8">communication hub</text>
  <text x="600" y="488" text-anchor="middle" font-size="13.5" fill="#b7b0e8">Rust · axum · SQLite</text>

  <!-- inner ring: hub parts -->
  <g font-size="14.5" font-weight="600" text-anchor="middle">
    <g>
      <rect x="554" y="312" width="92" height="30" rx="15" fill="#04060d" stroke="#8b7bff" stroke-width="1.5"/>
      <text x="600" y="332" fill="#cfc8ff">Inbox</text>
    </g>
    <g>
      <rect x="684" y="375" width="96" height="30" rx="15" fill="#04060d" stroke="#5eead4" stroke-width="1.5"/>
      <text x="732" y="395" fill="#5eead4">Channels</text>
    </g>
    <g>
      <rect x="684" y="525" width="96" height="30" rx="15" fill="#04060d" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="732" y="545" fill="#7dd3fc">Webhooks</text>
    </g>
    <g>
      <rect x="554" y="598" width="92" height="30" rx="15" fill="#04060d" stroke="#f5c46b" stroke-width="1.5"/>
      <text x="600" y="618" fill="#f5c46b">Runs</text>
    </g>
    <g>
      <rect x="420" y="525" width="88" height="30" rx="15" fill="#04060d" stroke="#8b7bff" stroke-width="1.5"/>
      <text x="464" y="545" fill="#cfc8ff">Mail</text>
    </g>
    <g>
      <rect x="420" y="375" width="88" height="30" rx="15" fill="#04060d" stroke="#5eead4" stroke-width="1.5"/>
      <text x="464" y="395" fill="#5eead4">DMs</text>
    </g>
  </g>

  <!-- agent nodes -->
  <g text-anchor="middle">
    <g>
      <circle cx="833" cy="237" r="62" fill="#141031" stroke="#8b7bff" stroke-width="2.5"/>
      <text x="833" y="232" font-size="18" font-weight="700" fill="#f5f3ff">Agent 1</text>
      <text x="833" y="254" font-size="12.5" fill="#9d95d6">webhook caller</text>
    </g>
    <g>
      <circle cx="367" cy="237" r="62" fill="#141031" stroke="#5eead4" stroke-width="2.5"/>
      <text x="367" y="232" font-size="18" font-weight="700" fill="#f5f3ff">Agent 2</text>
      <text x="367" y="254" font-size="12.5" fill="#9d95d6">receives runs</text>
    </g>
    <g>
      <circle cx="367" cy="703" r="62" fill="#141031" stroke="#f5c46b" stroke-width="2.5"/>
      <text x="367" y="698" font-size="18" font-weight="700" fill="#f5f3ff">Agent 3</text>
      <text x="367" y="720" font-size="12.5" fill="#9d95d6">reads mail</text>
    </g>
    <g>
      <circle cx="833" cy="703" r="62" fill="#141031" stroke="#7dd3fc" stroke-width="2.5"/>
      <text x="833" y="698" font-size="18" font-weight="700" fill="#f5f3ff">Agent 4</text>
      <text x="833" y="720" font-size="12.5" fill="#9d95d6">live inbox via SSE</text>
    </g>
  </g>

  <!-- caption -->
  <text x="600" y="846" text-anchor="middle" font-size="15" fill="#8d86bd">Agents reach the hub over the versioned /v1 API; the hub fans messages out to inbox receipts and webhook runs.</text>
</svg>
