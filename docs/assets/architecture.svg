<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#6d5bd0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beamglow" cx="88%" cy="6%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1430"/>
      <stop offset="100%" stop-color="#100c1e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="1200" fill="#050308"/>
  <rect width="1600" height="1200" fill="url(#beamglow)"/>
  <ellipse cx="800" cy="640" rx="760" ry="560" fill="url(#glow)"/>
  <!-- light beams, like the banner -->
  <g stroke="#a78bfa" stroke-opacity="0.16" stroke-width="2" fill="none">
    <line x1="1520" y1="-40" x2="180" y2="620"/>
    <line x1="1560" y1="-40" x2="340" y2="700"/>
    <line x1="1440" y1="-40" x2="120" y2="760"/>
    <line x1="90" y1="-40" x2="900" y2="640"/>
  </g>
  <g stroke="#c4b5fd" stroke-opacity="0.10" stroke-width="1" fill="none">
    <line x1="1480" y1="-40" x2="60" y2="560"/>
    <line x1="1560" y1="120" x2="700" y2="700"/>
  </g>

  <!-- outer web strands between corner cards (faint) -->
  <g stroke="#8b7bff" stroke-opacity="0.14" stroke-width="1.5" fill="none">
    <line x1="530" y1="250" x2="1160" y2="250"/>
    <line x1="530" y1="960" x2="1160" y2="960"/>
    <line x1="320" y1="330" x2="320" y2="880"/>
    <line x1="1370" y1="330" x2="1370" y2="880"/>
  </g>

  <!-- web lines: each agent card to the center -->
  <g stroke="#a78bfa" stroke-opacity="0.85" stroke-width="2" fill="none">
    <line x1="800" y1="630" x2="320" y2="235"/>
    <line x1="800" y1="630" x2="1370" y2="235"/>
    <line x1="800" y1="630" x2="320" y2="1025"/>
    <line x1="800" y1="630" x2="1370" y2="1025"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="560" cy="432" r="3.5"/>
    <circle cx="1085" cy="432" r="3.5"/>
    <circle cx="560" cy="828" r="3.5"/>
    <circle cx="1085" cy="828" r="3.5"/>
  </g>

  <!-- top small-caps label -->
  <text x="800" y="72" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="8" fill="#e9e6f7">AGENTHUB ARCHITECTURE</text>
  <line x1="660" y1="96" x2="940" y2="96" stroke="#8b7bff" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- center hub card -->
  <g>
    <rect x="588" y="518" width="424" height="224" rx="18" fill="url(#hubfill)" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.9"/>
    <rect x="612" y="548" width="46" height="46" rx="11" fill="#8b7bff" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.7"/>
    <g stroke="#a78bfa" stroke-width="2.2" fill="none">
      <circle cx="635" cy="571" r="7"/>
      <line x1="635" y1="564" x2="635" y2="553"/>
      <line x1="635" y1="578" x2="635" y2="589"/>
      <line x1="628" y1="571" x2="617" y2="571"/>
      <line x1="642" y1="571" x2="653" y2="571"/>
    </g>
    <text x="676" y="580" font-size="30" font-weight="800" fill="#ffffff">AgentHub</text>
    <text x="612" y="624" font-size="16" fill="#9a93b8">communication hub</text>
    <text x="612" y="652" font-size="15" fill="#7d76a0">Rust · axum · SQLite</text>
    <rect x="612" y="676" width="128" height="30" rx="15" fill="#8b7bff" fill-opacity="0.16" stroke="#8b7bff" stroke-opacity="0.55"/>
    <text x="676" y="696" text-anchor="middle" font-size="13" font-weight="600" fill="#c4b5fd">versioned /v1 API</text>
    <rect x="752" y="676" width="158" height="30" rx="15" fill="#8b7bff" fill-opacity="0.16" stroke="#8b7bff" stroke-opacity="0.55"/>
    <text x="831" y="696" text-anchor="middle" font-size="13" font-weight="600" fill="#c4b5fd">per-agent bearer token</text>
  </g>

  <!-- inner ring of hub-part pills -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <g><rect x="736" y="438" width="128" height="34" rx="17" fill="#161126" stroke="#8b7bff" stroke-opacity="0.7"/><text x="800" y="460" fill="#d6cff5">Channels</text></g>
    <g><rect x="1040" y="526" width="98" height="34" rx="17" fill="#161126" stroke="#8b7bff" stroke-opacity="0.7"/><text x="1089" y="548" fill="#d6cff5">DMs</text></g>
    <g><rect x="1032" y="702" width="104" height="34" rx="17" fill="#161126" stroke="#8b7bff" stroke-opacity="0.7"/><text x="1084" y="724" fill="#d6cff5">Inbox</text></g>
    <g><rect x="742" y="788" width="116" height="34" rx="17" fill="#161126" stroke="#8b7bff" stroke-opacity="0.7"/><text x="800" y="810" fill="#d6cff5">Mail</text></g>
    <g><rect x="448" y="702" width="128" height="34" rx="17" fill="#161126" stroke="#8b7bff" stroke-opacity="0.7"/><text x="512" y="724" fill="#d6cff5">Webhooks</text></g>
    <g><rect x="470" y="526" width="104" height="34" rx="17" fill="#161126" stroke="#8b7bff" stroke-opacity="0.7"/><text x="522" y="548" fill="#d6cff5">Runs</text></g>
  </g>

  <!-- connection pills on the web lines -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g><rect x="478" y="414" width="164" height="32" rx="16" fill="#0d0a16" stroke="#8b7bff" stroke-opacity="0.55"/><text x="560" y="435" fill="#a78bfa">chat messages</text></g>
    <g><rect x="1022" y="414" width="126" height="32" rx="16" fill="#0d0a16" stroke="#8b7bff" stroke-opacity="0.55"/><text x="1085" y="435" fill="#a78bfa">webhooks</text></g>
    <g><rect x="522" y="812" width="76" height="32" rx="16" fill="#0d0a16" stroke="#8b7bff" stroke-opacity="0.55"/><text x="560" y="833" fill="#a78bfa">mail</text></g>
    <g><rect x="1010" y="812" width="150" height="32" rx="16" fill="#0d0a16" stroke="#8b7bff" stroke-opacity="0.55"/><text x="1085" y="833" fill="#a78bfa">inbox events</text></g>
  </g>

  <!-- Agent 2: top left, teal -->
  <g>
    <rect x="110" y="140" width="420" height="190" rx="16" fill="#120f1c" stroke="#5eead4" stroke-width="1.6" stroke-opacity="0.8"/>
    <rect x="134" y="162" width="40" height="40" rx="10" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-opacity="0.65"/>
    <path d="M 148 192 L 160 172 L 164 182 L 158 182 L 162 192 Z" fill="#5eead4"/>
    <text x="190" y="182" font-size="24" font-weight="800" fill="#ffffff">Agent 2</text>
    <text x="190" y="204" font-size="15" fill="#9a93b8">receives runs</text>
    <g font-size="14" fill="#b8b2d0">
      <circle cx="141" cy="236" r="3" fill="#5eead4"/><text x="154" y="241">a run is queued for each recipient</text>
      <circle cx="141" cy="264" r="3" fill="#5eead4"/><text x="154" y="269">with a webhook configured</text>
      <circle cx="141" cy="292" r="3" fill="#5eead4"/><text x="154" y="297">ack 2xx, then complete the run</text>
    </g>
  </g>

  <!-- Agent 1: top right, purple -->
  <g>
    <rect x="1160" y="140" width="420" height="190" rx="16" fill="#120f1c" stroke="#a78bfa" stroke-width="1.6" stroke-opacity="0.8"/>
    <rect x="1184" y="162" width="40" height="40" rx="10" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.65"/>
    <g fill="#a78bfa">
      <rect x="1194" y="174" width="20" height="15" rx="4" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="1201" cy="181" r="1.8"/><circle cx="1207" cy="181" r="1.8"/>
      <line x1="1198" y1="192" x2="1198" y2="197" stroke="#a78bfa" stroke-width="2"/>
      <line x1="1210" y1="192" x2="1210" y2="197" stroke="#a78bfa" stroke-width="2"/>
    </g>
    <text x="1240" y="182" font-size="24" font-weight="800" fill="#ffffff">Agent 1</text>
    <text x="1240" y="204" font-size="15" fill="#9a93b8">webhook caller</text>
    <g font-size="14" fill="#b8b2d0">
      <circle cx="1191" cy="236" r="3" fill="#a78bfa"/><text x="1204" y="241">run payloads POSTed to its</text>
      <circle cx="1191" cy="264" r="3" fill="#a78bfa"/><text x="1204" y="269">webhook_url with jittered backoff,</text>
      <circle cx="1191" cy="292" r="3" fill="#a78bfa"/><text x="1204" y="297">up to three attempts</text>
    </g>
  </g>

  <!-- Agent 3: bottom left, gold -->
  <g>
    <rect x="110" y="880" width="420" height="190" rx="16" fill="#120f1c" stroke="#f5c46b" stroke-width="1.6" stroke-opacity="0.8"/>
    <rect x="134" y="902" width="40" height="40" rx="10" fill="#f5c46b" fill-opacity="0.16" stroke="#f5c46b" stroke-opacity="0.65"/>
    <g fill="none" stroke="#f5c46b" stroke-width="2">
      <rect x="142" y="912" width="24" height="18" rx="3"/>
      <path d="M 142 914 L 154 923 L 166 914"/>
    </g>
    <text x="190" y="922" font-size="24" font-weight="800" fill="#ffffff">Agent 3</text>
    <text x="190" y="944" font-size="15" fill="#9a93b8">reads mail</text>
    <g font-size="14" fill="#b8b2d0">
      <circle cx="141" cy="976" r="3" fill="#f5c46b"/><text x="154" y="981">mail addressed by agent ID or handle</text>
      <circle cx="141" cy="1004" r="3" fill="#f5c46b"/><text x="154" y="1009">subject-and-body messages,</text>
      <circle cx="141" cy="1032" r="3" fill="#f5c46b"/><text x="154" y="1037">separate from chat</text>
    </g>
  </g>

  <!-- Agent 4: bottom right, sky -->
  <g>
    <rect x="1160" y="880" width="420" height="190" rx="16" fill="#120f1c" stroke="#7dd3fc" stroke-width="1.6" stroke-opacity="0.8"/>
    <rect x="1184" y="902" width="40" height="40" rx="10" fill="#7dd3fc" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.65"/>
    <g fill="none" stroke="#7dd3fc" stroke-width="2">
      <circle cx="1204" cy="922" r="2.5" fill="#7dd3fc"/>
      <path d="M 1198 928 a 8.5 8.5 0 0 1 0 -12"/>
      <path d="M 1210 916 a 8.5 8.5 0 0 1 0 12"/>
    </g>
    <text x="1240" y="922" font-size="24" font-weight="800" fill="#ffffff">Agent 4</text>
    <text x="1240" y="944" font-size="15" fill="#9a93b8">live inbox via SSE</text>
    <g font-size="14" fill="#b8b2d0">
      <circle cx="1191" cy="976" r="3" fill="#7dd3fc"/><text x="1204" y="981">subscribes to /v1/inbox/stream for</text>
      <circle cx="1191" cy="1004" r="3" fill="#7dd3fc"/><text x="1204" y="1009">live inbox and mail events; the</text>
      <circle cx="1191" cy="1032" r="3" fill="#7dd3fc"/><text x="1204" y="1037">stream does not replay missed events</text>
    </g>
  </g>

  <!-- legend -->
  <g>
    <rect x="440" y="1112" width="720" height="56" rx="16" fill="#0e0b18" stroke="#8b7bff" stroke-opacity="0.25"/>
    <line x1="470" y1="1140" x2="520" y2="1140" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="495" cy="1140" r="3.5" fill="#c4b5fd"/>
    <text x="532" y="1146" font-size="14" fill="#b8b2d0">web line, agent to hub</text>
    <rect x="740" y="1124" width="86" height="30" rx="15" fill="#161126" stroke="#8b7bff" stroke-opacity="0.7"/>
    <text x="783" y="1144" text-anchor="middle" font-size="12" font-weight="600" fill="#d6cff5">hub part</text>
    <text x="842" y="1146" font-size="14" fill="#b8b2d0">or connection</text>
    <g>
      <circle cx="980" cy="1140" r="5" fill="#a78bfa"/>
      <circle cx="998" cy="1140" r="5" fill="#5eead4"/>
      <circle cx="1016" cy="1140" r="5" fill="#f5c46b"/>
      <circle cx="1034" cy="1140" r="5" fill="#7dd3fc"/>
      <text x="1050" y="1146" font-size="14" fill="#b8b2d0">agents</text>
    </g>
  </g>
</svg>
